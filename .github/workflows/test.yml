name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regress:
    name: Linux, current versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare git
        run: |
          git lfs install --skip-repo
          git --version; git lfs version; python3 --version
      - name: Lint
        run: python3 -m py_compile git-filesync.py
      - name: Regression tests
        run: |
          test/regress.sh </dev/null | tee regress.log
          ! grep -q '^FAIL' regress.log

  minimum-versions:
    name: Linux, oldest supported versions (Python 3.7, Git 2.28)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t filesync-minver -f test/minver.Containerfile test
      - name: Regression tests
        run: |
          docker run --rm -v "$PWD":/src:ro -w /src filesync-minver test/regress.sh </dev/null | tee regress.log
          ! grep -q '^FAIL' regress.log
